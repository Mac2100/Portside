name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tagged v<app version>) from this run"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app + DMG
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app and DMG
        run: ./scripts/make_app.sh

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*marketing = "\([^"]*\)".*/\1/p' Sources/Portside/Support/AppVersion.swift)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portside-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          # On tag pushes, release under that tag; on manual dispatch, create
          # the tag v<app version> at the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
